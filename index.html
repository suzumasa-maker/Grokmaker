<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <!-- iPhone最適化：ズーム防止＆セーフエリア対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- iOS「ホーム画面に追加」(PWA) メタタグ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prompt Studio">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b" id="meta-theme-color">

  <title>Prompt Studio — AI画像プロンプトジェネレーター</title>

  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '"Noto Sans JP"', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    /* 基本フォント・タッチ操作の最適化 */
    html, body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* スクロールバー非表示（横スクロールタブ用） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* アコーディオン開閉アニメーション */
    .collapsible {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
    }
    .collapsible.open {
      grid-template-rows: 1fr;
    }
    .collapsible > div {
      overflow: hidden;
    }

    /* セーフエリア対応の余白 */
    .pb-safe {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    .pt-safe {
      padding-top: max(0.75rem, env(safe-area-inset-top));
    }
  </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased min-h-screen transition-colors duration-200">

  <!-- ヘッダー（上部固定） -->
  <header class="sticky top-0 z-30 bg-white/85 dark:bg-zinc-950/85 backdrop-blur-xl border-b border-zinc-200/80 dark:border-zinc-800/80 pt-safe">
    <div class="max-w-3xl mx-auto px-3.5 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 via-indigo-500 to-violet-600 flex items-center justify-center shadow-sm shrink-0">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-sm font-extrabold tracking-tight truncate">Prompt Studio</h1>
          <p class="text-[10px] text-zinc-500 dark:text-zinc-400 truncate">AI画像プロンプト生成</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <!-- 出力言語切替 -->
        <div class="flex items-center bg-zinc-100 dark:bg-zinc-900 p-0.5 rounded-lg border border-zinc-200/70 dark:border-zinc-800">
          <button type="button" data-lang="en" class="lang-btn px-2.5 py-1 rounded-md text-[11px] font-bold transition-all active:scale-95">EN</button>
          <button type="button" data-lang="ja" class="lang-btn px-2.5 py-1 rounded-md text-[11px] font-bold transition-all active:scale-95">日本語</button>
        </div>

        <!-- 履歴ボタン -->
        <button type="button" id="btn-open-history" title="履歴・お気に入り"
          class="relative p-2 rounded-xl bg-zinc-100 dark:bg-zinc-900 border border-zinc-200/70 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-800 active:scale-95 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span id="history-badge" class="hidden absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-blue-600 text-white text-[9px] font-bold flex items-center justify-center">0</span>
        </button>

        <!-- リセットボタン -->
        <button type="button" id="btn-reset-all" title="すべてリセット"
          class="p-2 rounded-xl bg-zinc-100 dark:bg-zinc-900 border border-zinc-200/70 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300 hover:text-red-500 active:scale-95 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>

        <!-- テーマ切替 -->
        <button type="button" id="btn-theme-toggle" title="ダーク/ライト切替"
          class="p-2 rounded-xl bg-zinc-100 dark:bg-zinc-900 border border-zinc-200/70 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300 active:scale-95 transition">
          <svg id="icon-sun" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <svg id="icon-moon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 対象AI切替バー -->
    <div class="max-w-3xl mx-auto px-3.5 pb-2.5">
      <div id="ai-tabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
        <!-- JSで描画 -->
      </div>
    </div>
  </header>

  <!-- メインコンテンツ（下部プレビューバー分の余白確保） -->
  <main class="max-w-3xl mx-auto px-3.5 pt-3.5 pb-64 space-y-4">

    <!-- 1. 主題・メインテーマ -->
    <section class="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 p-4 shadow-sm space-y-3.5">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-500"></span>
          メインの主題・描きたい内容
        </h2>
        <span id="ai-format-hint" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400"></span>
      </div>

      <textarea id="subject-input" rows="2" placeholder="例：雨上がりのネオン街に立つ猫、窓辺で読書する少女（人物設定だけ使う場合は空欄でもOK）"
        class="w-full text-base rounded-xl bg-zinc-50 dark:bg-zinc-950/70 border border-zinc-200 dark:border-zinc-800 px-3 py-2.5 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition resize-none"></textarea>

      <!-- 画像内テキスト＆アスペクト比 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label for="text-in-image-input" class="block text-[11px] font-semibold text-zinc-500 dark:text-zinc-400 mb-1">画像内に入れたい文字（任意）</label>
          <input type="text" id="text-in-image-input" placeholder='例："OPEN", "SUMMER SALE"'
            class="w-full text-base rounded-xl bg-zinc-50 dark:bg-zinc-950/70 border border-zinc-200 dark:border-zinc-800 px-3 py-2 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition">
        </div>
        <div>
          <span class="block text-[11px] font-semibold text-zinc-500 dark:text-zinc-400 mb-1">アスペクト比（比率）</span>
          <div id="ratio-container" class="flex flex-wrap gap-1.5">
            <!-- JSで描画 -->
          </div>
        </div>
      </div>
    </section>

    <!-- 2. 人物設定（最大3人） -->
    <section class="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm overflow-hidden">
      <div class="px-4 py-3.5 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-2 h-2 rounded-full bg-violet-500 shrink-0"></span>
          <h2 class="text-sm font-bold truncate">人物設定（最大3人）</h2>
          <span id="char-count-badge" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400">0人</span>
        </div>
        <button type="button" id="btn-add-character"
          class="px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white active:scale-95 transition shrink-0">
          ＋ 人物を追加
        </button>
      </div>

      <!-- 人物タブ＆フォーム -->
      <div id="char-section-body" class="hidden border-t border-zinc-100 dark:border-zinc-800/80 px-4 pb-4 pt-3 space-y-4">
        <!-- 人物切替タブ -->
        <div id="char-tabs-container" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <!-- JSで描画 -->
        </div>

        <!-- 複数人配置・関係性（2人以上のとき表示） -->
        <div id="group-relation-box" class="hidden rounded-xl bg-zinc-50 dark:bg-zinc-950/60 border border-zinc-200/80 dark:border-zinc-800 p-3 space-y-3">
          <!-- JSで描画 -->
        </div>

        <!-- 選択中人物の詳細フォーム -->
        <div id="char-active-form" class="space-y-4">
          <!-- JSで描画 -->
        </div>
      </div>
    </section>

    <!-- 3. シーン・背景設定（アコーディオン） -->
    <section class="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm overflow-hidden">
      <button type="button" id="btn-toggle-scene" aria-expanded="false"
        class="w-full px-4 py-3.5 flex items-center justify-between gap-2 text-left active:bg-zinc-50 dark:active:bg-zinc-800/50 transition">
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
          <h2 class="text-sm font-bold truncate">シーン・背景・時間帯・天候</h2>
          <span id="scene-summary-badge" class="hidden text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-400">設定中</span>
        </div>
        <svg id="scene-chevron" class="w-4 h-4 text-zinc-400 transition-transform duration-200 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <div id="scene-body" class="collapsible">
        <div id="scene-form-container" class="px-4 pb-4 pt-2 space-y-4 border-t border-zinc-100 dark:border-zinc-800/80">
          <!-- JSで描画 -->
        </div>
      </div>
    </section>

    <!-- 4. 7カテゴリータグ選択（画風・構図・光/影・雰囲気・色彩・品質・質感） -->
    <section class="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm overflow-hidden">
      <div class="px-4 pt-3.5 pb-2 border-b border-zinc-100 dark:border-zinc-800/80">
        <div class="flex items-center justify-between mb-2.5">
          <h2 class="text-sm font-bold flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            スタイル・演出タグ
          </h2>
          <span id="selected-count-badge" class="text-[11px] font-bold text-zinc-500 dark:text-zinc-400">0個選択中</span>
        </div>

        <!-- カテゴリータブ -->
        <div id="category-tabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
          <!-- JSで描画 -->
        </div>
      </div>

      <!-- アクティブカテゴリーのチップ一覧 -->
      <div id="category-panel" class="p-4 space-y-3">
        <!-- JSで描画 -->
      </div>

      <!-- 選択中タグサマリー -->
      <div id="selected-summary-wrap" class="hidden px-4 pb-4 pt-2 border-t border-zinc-100 dark:border-zinc-800/80">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[11px] font-bold text-zinc-500 dark:text-zinc-400">選択中のスタイルタグ（タップで解除）</span>
          <button type="button" id="btn-clear-tags" class="text-[11px] font-semibold text-zinc-400 hover:text-red-500 transition">全解除</button>
        </div>
        <div id="selected-summary" class="flex flex-wrap gap-1.5">
          <!-- JSで描画 -->
        </div>
      </div>
    </section>

    <!-- 5. 詳細オプション（避けたい要素・ネガティブ指示） -->
    <section class="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm overflow-hidden">
      <button type="button" id="btn-toggle-options" aria-expanded="false"
        class="w-full px-4 py-3.5 flex items-center justify-between gap-2 text-left active:bg-zinc-50 dark:active:bg-zinc-800/50 transition">
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-2 h-2 rounded-full bg-rose-500 shrink-0"></span>
          <h2 class="text-sm font-bold truncate">詳細オプション（除外要素・ネガティブ指示）</h2>
        </div>
        <svg id="accordion-chevron" class="w-4 h-4 text-zinc-400 transition-transform duration-200 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <div id="accordion-options-body" class="collapsible">
        <div class="px-4 pb-4 pt-2 space-y-4 border-t border-zinc-100 dark:border-zinc-800/80">
          <div>
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <label for="negative-input" class="block text-xs font-semibold text-zinc-600 dark:text-zinc-300">
                避けたい要素（ネガティブ指示）
              </label>
              <div class="flex items-center gap-1.5">
                <button type="button" id="btn-neg-quality-pack"
                  class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-blue-500/10 text-blue-600 dark:text-blue-400 hover:bg-blue-500/20 active:scale-95 transition">
                  + 定番品質セット
                </button>
                <button type="button" id="btn-clear-negative"
                  class="text-[11px] font-medium text-zinc-400 hover:text-red-500 px-1.5 py-0.5 rounded active:scale-95 transition">
                  クリア
                </button>
              </div>
            </div>
            <input type="text" id="negative-input" placeholder="例：lowres, bad anatomy, bad hands, watermark"
              class="w-full text-base rounded-xl bg-zinc-50 dark:bg-zinc-950/70 border border-zinc-200 dark:border-zinc-800 px-3 py-2.5 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition">
            <div id="neg-chips-container" class="mt-2.5 flex flex-wrap gap-1.5">
              <!-- JSで描画 -->
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 下部固定：リアルタイムプレビュー＆コピーバー -->
  <div class="fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-zinc-950/95 backdrop-blur-xl border-t border-zinc-200 dark:border-zinc-800 shadow-[0_-8px_30px_rgba(0,0,0,0.12)] pb-safe">
    <div class="max-w-3xl mx-auto px-3.5 pt-2.5 space-y-2">
      <!-- 安全チェック警告バナー（該当語がある場合のみ表示） -->
      <div id="safety-banner" class="hidden rounded-xl bg-amber-500/10 border border-amber-500/30 px-3 py-2 text-xs text-amber-800 dark:text-amber-300 space-y-1.5">
        <!-- JSで描画 -->
      </div>

      <!-- プレビューヘッダー -->
      <div class="flex items-center justify-between gap-2">
        <button type="button" id="btn-toggle-preview" class="flex items-center gap-1.5 text-xs font-bold text-zinc-700 dark:text-zinc-200 active:opacity-70">
          <span>生成プロンプト</span>
          <span id="preview-char-count" class="text-[10px] font-medium text-zinc-400">0文字</span>
          <svg id="preview-chevron" class="w-3.5 h-3.5 text-zinc-400 transition-transform" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
          </svg>
        </button>

        <div class="flex items-center gap-1.5">
          <button type="button" id="btn-save-favorite" title="履歴にお気に入り保存"
            class="px-2.5 py-2 rounded-xl bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-xs font-bold text-zinc-600 dark:text-zinc-300 hover:text-amber-500 active:scale-95 transition">
            ★ 保存
          </button>
          <button type="button" id="btn-copy-prompt"
            class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-extrabold shadow-sm active:scale-95 transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span>コピー</span>
          </button>
        </div>
      </div>

      <!-- プレビューテキストエリア -->
      <div id="preview-box-wrap" class="transition-all">
        <div id="prompt-preview" class="w-full max-h-24 overflow-y-auto rounded-xl bg-zinc-100/90 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 px-3 py-2 text-xs leading-relaxed text-zinc-800 dark:text-zinc-200 font-mono whitespace-pre-wrap break-words select-all">
          項目を選択するか主題を入力すると、ここに最適化されたプロンプトが表示されます。
        </div>
      </div>
    </div>
  </div>

  <!-- モーダル1：カスタムラベル追加 -->
  <div id="modal-add-label" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="w-full sm:max-w-md bg-white dark:bg-zinc-900 rounded-t-3xl sm:rounded-2xl border border-zinc-200 dark:border-zinc-800 p-5 space-y-4 shadow-2xl pb-safe">
      <div class="flex items-center justify-between">
        <h3 id="modal-add-title" class="text-sm font-extrabold">カスタムラベルを追加</h3>
        <button type="button" id="btn-close-label-modal" class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200">✕</button>
      </div>
      <div class="space-y-3">
        <div>
          <label for="custom-label-ja" class="block text-xs font-semibold text-zinc-600 dark:text-zinc-300 mb-1">表示名（日本語など）<span class="text-rose-500">*</span></label>
          <input type="text" id="custom-label-ja" placeholder="例：ネオンパーカー"
            class="w-full text-base rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
        </div>
        <div>
          <label for="custom-label-en" class="block text-xs font-semibold text-zinc-600 dark:text-zinc-300 mb-1">英語プロンプト（任意・空欄なら表示名をそのまま使用）</label>
          <input type="text" id="custom-label-en" placeholder="例：neon glowing hoodie"
            class="w-full text-base rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-1">
        <button type="button" id="btn-cancel-label-modal" class="px-4 py-2 rounded-xl text-xs font-bold bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 active:scale-95 transition">キャンセル</button>

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message, icon = '✓') {
        const el = document.createElement('div');
        el.className = 'pointer-events-auto flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 text-xs font-bold shadow-xl transition-all duration-300 opacity-0 -translate-y-2';
        el.innerHTML = `<span>${escapeHtml(icon)}</span><span>${escapeHtml(message)}</span>`;
        dom.toastContainer.appendChild(el);
        requestAnimationFrame(() => {
          el.classList.remove('opacity-0', '-translate-y-2');
        });
        setTimeout(() => {
          el.classList.add('opacity-0', '-translate-y-2');
          setTimeout(() => el.remove(), 300);
        }, 2100);
      }

      // PC Chrome（ローカルファイル含む）＆iPhone Safari対応コピー処理
      function copyTextToClipboard(text) {
        if (!text) return false;
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.top = '0';
          textarea.style.left = '0';
          textarea.style.width = '2em';
          textarea.style.height = '2em';
          textarea.style.padding = '0';
          textarea.style.border = 'none';
          textarea.style.outline = 'none';
          textarea.style.boxShadow = 'none';
          textarea.style.background = 'transparent';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);

          textarea.focus({ preventScroll: true });
          textarea.select();
          textarea.setSelectionRange(0, text.length);

          const ok = document.execCommand('copy');
          document.body.removeChild(textarea);
          return ok;
        } catch (err) {
          return false;
        }
      }

      // ============================================================
      // 4. プロンプト生成エンジン
      // ============================================================
      function formatCharacterPhrase(char, isEn, includePosition) {
        const genderObj = CHARACTER_PRESETS.genders.find(g => g.id === char.gender);
        const natObj = getFieldItems('nationality').find(n => n.id === char.nationality);
        const raceObj = getFieldItems('race').find(r => r.id === char.race);
        const hairLenObj = getFieldItems('hairLength').find(h => h.id === char.hairLength);
        const hairColObj = getFieldItems('hairColor').find(h => h.id === char.hairColor);
        const eyeColObj = getFieldItems('eyeColor').find(e => e.id === char.eyeColor);
        const styleObjs = (char.styles || []).map(id => getFieldItems('styles').find(s => s.id === id)).filter(Boolean);
        const exprObjs = (char.expressions || []).map(id => getFieldItems('expressions').find(ex => ex.id === id)).filter(Boolean);
        const outfitObj = getFieldItems('outfit').find(o => o.id === char.outfit);
        const poseObj = getFieldItems('pose').find(p => p.id === char.pose);
        const propObjs = (char.props || []).map(id => getFieldItems('props').find(p => p.id === id)).filter(Boolean);
        const posObj = includePosition ? CHARACTER_PRESETS.positions.find(p => p.id === char.position) : null;

        const natCustom = (char.nationalityCustom || '').trim();
        const raceCustom = (char.raceCustom || '').trim();
        const hairLenCustom = (char.hairLengthCustom || '').trim();
        const hairColCustom = (char.hairColorCustom || '').trim();
        const eyeColCustom = (char.eyeColorCustom || '').trim();
        const styleCustom = (char.styleCustom || '').trim();
        const action = (char.action || '').trim();
        const outfitCustom = (char.outfitCustom || '').trim();
        const poseCustom = (char.poseCustom || '').trim();
        const propsCustom = (char.propsCustom || '').trim();

        if (isEn) {
          const headParts = [];
          if (natObj && natObj.en) headParts.push(natObj.en);
          if (natCustom) headParts.push(natCustom);
          if (raceObj && raceObj.en && raceObj.id !== 'rc_human') headParts.push(raceObj.en);
          if (raceCustom) headParts.push(raceCustom);
          if (genderObj && genderObj.en) headParts.push(genderObj.en);
          const main = headParts.length ? headParts.join(' ') : 'character';

          const details = [];
          const hCol = [hairColObj ? hairColObj.en : '', hairColCustom].filter(Boolean).join(' ');
          const hLen = [hairLenObj ? hairLenObj.en : '', hairLenCustom].filter(Boolean).join(', ');
          if (hCol && hLen) {
            details.push(`${hCol} ${hLen}`);
          } else if (hCol) {
            details.push(`${hCol} hair`);
          } else if (hLen) {
            details.push(hLen);
          }

          const eyeList = [eyeColObj ? eyeColObj.en : '', eyeColCustom].filter(Boolean);
          if (eyeList.length) details.push(eyeList.join(', '));

          const styleList = [...styleObjs.map(s => s.en), ...(styleCustom ? [styleCustom] : [])];
          if (styleList.length) details.push(styleList.join(', '));

          const outfitList = [outfitObj ? outfitObj.en : '', outfitCustom].filter(Boolean);
          if (outfitList.length) details.push(`wearing ${outfitList.join(', ')}`);

          const poseList = [poseObj ? poseObj.en : '', poseCustom].filter(Boolean);
          if (poseList.length) details.push(poseList.join(', '));

          const propList = [...propObjs.map(p => p.en), ...(propsCustom ? [propsCustom] : [])];
          if (propList.length) details.push(`holding ${propList.join(' and ')}`);

          const exprList = [...exprObjs.map(ex => ex.en), ...(action ? [action] : [])];
          if (exprList.length) details.push(exprList.join(', '));

          if (posObj && posObj.en) details.push(posObj.en);

          return details.length ? `${main}, ${details.join(', ')}` : main;
        } else {
          const headParts = [];
          if (natObj) headParts.push(natObj.label);
          if (natCustom) headParts.push(natCustom);
          if (raceObj && raceObj.id !== 'rc_human') headParts.push(raceObj.label);
          if (raceCustom) headParts.push(raceCustom);
          if (genderObj && genderObj.id) headParts.push(genderObj.label);
          const head = headParts.length ? headParts.join('の') : '人物';

          const sub = [];
          const hairParts = [hairColObj ? hairColObj.label : '', hairColCustom, hairLenObj ? hairLenObj.label : '', hairLenCustom].filter(Boolean);
          if (hairParts.length) sub.push(`髪：${hairParts.join('・')}`);

          const eyeParts = [eyeColObj ? eyeColObj.label : '', eyeColCustom].filter(Boolean);
          if (eyeParts.length) sub.push(`瞳：${eyeParts.join('・')}`);

          const styleList = [...styleObjs.map(s => s.label), ...(styleCustom ? [styleCustom] : [])];
          if (styleList.length) sub.push(`特徴：${styleList.join('、')}`);

          const outfitList = [outfitObj ? outfitObj.label : '', outfitCustom].filter(Boolean);
          if (outfitList.length) sub.push(`服装：${outfitList.join('、')}`);

          const poseList = [poseObj ? poseObj.label : '', poseCustom].filter(Boolean);
          if (poseList.length) sub.push(`姿勢：${poseList.join('、')}`);

          const propList = [...propObjs.map(p => p.label), ...(propsCustom ? [propsCustom] : [])];
          if (propList.length) sub.push(`小物：${propList.join('、')}`);

          const exprList = [...exprObjs.map(ex => ex.label), ...(action ? [action] : [])];
          if (exprList.length) sub.push(`表情・動作：${exprList.join('、')}`);

          if (posObj && posObj.id) sub.push(`位置：${posObj.label}`);

          return sub.length ? `${head}（${sub.join('／')}）` : head;
        }
      }

      function buildCharactersText(isEn) {
        const count = state.characters.length;
        if (count === 0) return '';
        const includePos = count >= 2;
        const phrases = state.characters.map((c, idx) => {
          const text = formatCharacterPhrase(c, isEn, includePos);
          return count >= 2 ? (isEn ? `Person ${idx + 1}: ${text}` : `人物${idx + 1}：${text}`) : text;
        });

        const relParts = [];
        if (count >= 2) {
          const arrObj = getFieldItems('arrangement').find(a => a.id === state.groupRelation.arrangement);
          const intObj = getFieldItems('interaction').find(i => i.id === state.groupRelation.interaction);
          if (arrObj) relParts.push(isEn ? arrObj.en : arrObj.label);
          if (intObj) relParts.push(isEn ? intObj.en : intObj.label);
          if (state.groupRelation.custom.trim()) relParts.push(state.groupRelation.custom.trim());
        }

        if (isEn) {
          const prefix = count >= 2 ? `${count} people in the scene` + (relParts.length ? ` (${relParts.join(', ')})` : '') + ': ' : '';
          return prefix + phrases.join('; ');
        } else {
          const prefix = count >= 2 ? `${count}人の人物` + (relParts.length ? `（${relParts.join('、')}）` : '') + '：' : '';
          return prefix + phrases.join(' ／ ');
        }
      }

      function buildSceneText(isEn) {
        const sc = state.scene;
        const bgObj = getFieldItems('background').find(b => b.id === sc.background);
        const timeObj = getFieldItems('time').find(t => t.id === sc.time);
        const weatherObjs = (sc.weathers || []).map(id => getFieldItems('weathers').find(w => w.id === id)).filter(Boolean);

        const parts = [];
        if (bgObj) parts.push(isEn ? bgObj.en : bgObj.label);
        if (sc.backgroundCustom.trim()) parts.push(sc.backgroundCustom.trim());
        if (timeObj) parts.push(isEn ? timeObj.en : timeObj.label);
        if (sc.timeCustom.trim()) parts.push(sc.timeCustom.trim());
        weatherObjs.forEach(w => parts.push(isEn ? w.en : w.label));
        if (sc.weatherCustom.trim()) parts.push(sc.weatherCustom.trim());

        return parts.join(isEn ? ', ' : '、');
      }

      function generatePrompt() {
        const isEn = state.lang === 'en';
        const subject = state.subject.trim();
        const textInImage = state.textInImage.trim();
        const negative = state.negative.trim();
        const ratioObj = ASPECT_RATIOS.find(r => r.id === state.ratio);

        const charsText = buildCharactersText(isEn);
        const sceneText = buildSceneText(isEn);

        const styles = getSelectedItems('style').map(i => isEn ? i.en : i.label);
        const comps = getSelectedItems('composition').map(i => isEn ? i.en : i.label);
        const lights = getSelectedItems('lighting').map(i => isEn ? i.en : i.label);
        const moods = getSelectedItems('mood').map(i => isEn ? i.en : i.label);
        const colors = getSelectedItems('color').map(i => isEn ? i.en : i.label);
        const quals = getSelectedItems('quality').map(i => isEn ? i.en : i.label);
        const textures = getSelectedItems('texture').map(i => isEn ? i.en : i.label);

        const hasAnything = Boolean(
          subject || charsText || sceneText || textInImage || negative ||
          (ratioObj && ratioObj.id) ||
          styles.length || comps.length || lights.length || moods.length || colors.length || quals.length || textures.length
        );
        if (!hasAnything) return '';

        // ChatGPT向け（自然な文章）
        if (state.ai === 'chatgpt') {
          if (isEn) {
            const sentences = [];
            const mainCore = [subject, charsText].filter(Boolean).join(', ');
            if (mainCore) sentences.push(`Create an image of ${mainCore}.`);
            if (sceneText) sentences.push(`Setting and environment: ${sceneText}.`);
            if (textInImage) sentences.push(`Include clear, legible text reading "${textInImage}" naturally in the image.`);

            const tech = [];
            if (styles.length) tech.push(`Art style: ${styles.join(', ')}`);
            if (comps.length) tech.push(`Composition: ${comps.join(', ')}`);
            if (lights.length) tech.push(`Lighting and shadow: ${lights.join(', ')}`);
            if (moods.length) tech.push(`Atmosphere: ${moods.join(', ')}`);
            if (colors.length) tech.push(`Color palette: ${colors.join(', ')}`);
            if (textures.length) tech.push(`Textures and materials: ${textures.join(', ')}`);
            if (quals.length) tech.push(`Details and quality: ${quals.join(', ')}`);
            if (tech.length) sentences.push(tech.join('. ') + '.');

            if (ratioObj && ratioObj.textEn) sentences.push(`Format: ${ratioObj.textEn}.`);
            if (negative) sentences.push(`Avoid: ${negative}.`);
            return sentences.join(' ');
          } else {
            const lines = [];
            const mainCore = [subject, charsText].filter(Boolean).join('。');
            if (mainCore) lines.push(`${mainCore}を描いた画像を生成してください。`);
            if (sceneText) lines.push(`背景・シーンは${sceneText}にしてください。`);
            if (textInImage) lines.push(`画像内に「${textInImage}」という文字を自然で読みやすく入れてください。`);
            if (styles.length) lines.push(`画風は${styles.join('、')}で表現してください。`);
            if (comps.length) lines.push(`構図・カメラは${comps.join('、')}にしてください。`);
            if (lights.length) lines.push(`光と影は${lights.join('、')}を演出してください。`);
            if (moods.length) lines.push(`全体の雰囲気は${moods.join('、')}にしてください。`);
            if (colors.length) lines.push(`色彩は${colors.join('、')}を基調としてください。`);
            if (textures.length) lines.push(`質感・素材は${textures.join('、')}を取り入れてください。`);
            if (quals.length) lines.push(`仕上がりは${quals.join('、')}で描写してください。`);
            if (ratioObj && ratioObj.textJa) lines.push(`アスペクト比は${ratioObj.textJa}にしてください。`);
            if (negative) lines.push(`以下の要素は含めないでください：${negative}。`);
            return lines.join('\n');
          }
        }

        // Gemini向け（構造化フォーマット）
        if (state.ai === 'gemini') {
          const lines = [];
          if (isEn) {
            if (subject) lines.push(`- Subject: ${subject}`);
            if (charsText) lines.push(`- Characters: ${charsText}`);
            if (sceneText) lines.push(`- Scene & Background: ${sceneText}`);
            if (textInImage) lines.push(`- Text in Image: "${textInImage}"`);
            if (styles.length) lines.push(`- Style: ${styles.join(', ')}`);
            if (comps.length) lines.push(`- Composition: ${comps.join(', ')}`);
            if (lights.length) lines.push(`- Lighting & Shadow: ${lights.join(', ')}`);
            if (moods.length) lines.push(`- Mood: ${moods.join(', ')}`);
            if (colors.length) lines.push(`- Color Tone: ${colors.join(', ')}`);
            if (textures.length) lines.push(`- Textures & Materials: ${textures.join(', ')}`);
            if (quals.length) lines.push(`- Quality & Details: ${quals.join(', ')}`);
            if (ratioObj && ratioObj.textEn) lines.push(`- Aspect Ratio: ${ratioObj.textEn}`);
            if (negative) lines.push(`- Exclude: ${negative}`);
          } else {
            if (subject) lines.push(`・主題：${subject}`);
            if (charsText) lines.push(`・人物：${charsText}`);
            if (sceneText) lines.push(`・背景・シーン：${sceneText}`);
            if (textInImage) lines.push(`・画像内テキスト：「${textInImage}」`);
            if (styles.length) lines.push(`・画風：${styles.join('、')}`);
            if (comps.length) lines.push(`・構図・カメラ：${comps.join('、')}`);
            if (lights.length) lines.push(`・光と影：${lights.join('、')}`);
            if (moods.length) lines.push(`・雰囲気：${moods.join('、')}`);
            if (colors.length) lines.push(`・色彩：${colors.join('、')}`);
            if (textures.length) lines.push(`・質感・素材：${textures.join('、')}`);
            if (quals.length) lines.push(`・品質・ディテール：${quals.join('、')}`);
            if (ratioObj && ratioObj.textJa) lines.push(`・アスペクト比：${ratioObj.textJa}`);
            if (negative) lines.push(`・除外要素：${negative}`);
          }
          return lines.join('\n');
        }

        // Midjourney / Grok / SD 向け（タグ・フレーズ連結）
        const chunks = [];
        if (subject) chunks.push(subject);
        if (charsText) chunks.push(charsText);
        if (sceneText) chunks.push(sceneText);
        if (styles.length) chunks.push(...styles);
        if (comps.length) chunks.push(...comps);
        if (lights.length) chunks.push(...lights);
        if (moods.length) chunks.push(...moods);
        if (colors.length) chunks.push(...colors);
        if (textures.length) chunks.push(...textures);
        if (quals.length) chunks.push(...quals);
        if (textInImage) chunks.push(isEn ? `crisp visible text "${textInImage}"` : `文字「${textInImage}」を鮮明に表示`);

        let result = chunks.join(isEn ? ', ' : '、');

        if (state.ai === 'midjourney') {
          const params = [];
          if (ratioObj && ratioObj.mj) params.push(ratioObj.mj);
          if (negative) params.push(`--no ${negative}`);
          if (params.length) result += (result ? ' ' : '') + params.join(' ');
        } else if (state.ai === 'sd') {
          if (ratioObj && ratioObj.id) result += (result ? (isEn ? ', ' : '、') : '') + (isEn ? ratioObj.textEn : ratioObj.textJa);
          if (negative) result += `\n\nNegative prompt: ${negative}`;
        } else {
          // Grok
          if (ratioObj && ratioObj.id) result += (result ? (isEn ? ', ' : '、') : '') + (isEn ? ratioObj.textEn : ratioObj.textJa);
          if (negative) result += isEn ? `. Avoid: ${negative}` : `。除外：${negative}`;
        }
        return result;
      }

      // 事前安全チェック
      function runSafetyCheck(promptText) {
        const hits = [];
        SAFETY_RULES.forEach(rule => {
          if (rule.pattern.test(promptText)) {
            hits.push(rule);
          }
        });
        if (hits.length === 0) {
          dom.safetyBanner.classList.add('hidden');
          dom.safetyBanner.innerHTML = '';
          return;
        }
        dom.safetyBanner.classList.remove('hidden');
        dom.safetyBanner.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="font-bold">⚠️ 生成AIの制限に引っかかる可能性のある語を検知</p>
              <p class="text-[11px] opacity-90 mt-0.5">${hits.map(h => `「${escapeHtml(h.word)}」`).join('・')} が含まれています。必要に応じて安全な表現へ調整できます。</p>
            </div>
          </div>
        `;
      }

      // ============================================================
      // 5. UI描画関数群
      // ============================================================
      function getActiveAICfg() {
        return AI_CONFIGS[state.ai] || AI_CONFIGS.chatgpt;
      }

      function renderAITabs() {
        dom.aiTabs.innerHTML = '';
        Object.values(AI_CONFIGS).forEach(cfg => {
          const isCurrent = cfg.id === state.ai;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.ai = cfg.id;
          btn.textContent = cfg.name;
          btn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold border whitespace-nowrap transition-all active:scale-95 ' +
            (isCurrent
              ? cfg.activeTab
              : 'bg-zinc-100 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-300 border-zinc-200/80 dark:border-zinc-800 hover:border-zinc-300 dark:hover:border-zinc-700');
          dom.aiTabs.appendChild(btn);
        });
        dom.aiFormatHint.textContent = getActiveAICfg().hint;
      }

      function renderRatios() {
        const cfg = getActiveAICfg();
        dom.ratioContainer.innerHTML = '';
        ASPECT_RATIOS.forEach(r => {
          const active = state.ratio === r.id;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.ratio = r.id;
          btn.textContent = r.label;
          btn.className = 'px-2.5 py-1 rounded-lg text-[11px] font-bold border transition-all active:scale-95 ' +
            (active
              ? cfg.activeChip
              : 'bg-zinc-50 dark:bg-zinc-950/60 text-zinc-600 dark:text-zinc-300 border-zinc-200 dark:border-zinc-800');
          dom.ratioContainer.appendChild(btn);
        });
      }

      // 共通ラベルチップHTML生成（カスタム項目は削除ボタン付き）
      function buildLabelChipHtml(item, isSelected, dataAttr, groupKey, cfg) {
        const idleCls = 'bg-zinc-50 dark:bg-zinc-950/60 text-zinc-700 dark:text-zinc-300 border-zinc-200 dark:border-zinc-800 hover:border-zinc-300 dark:hover:border-zinc-700';
        const cls = isSelected ? cfg.activeChip : idleCls;
        const delBtn = item.isCustom
          ? `<span data-delete-custom-group="${escapeHtml(groupKey)}" data-delete-custom-id="${escapeHtml(item.id)}" class="ml-1 px-1 rounded-full hover:bg-black/20 text-[10px] leading-none" title="削除">×</span>`
          : '';
        return `<button type="button" ${dataAttr}="${escapeHtml(item.id)}" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all active:scale-95 inline-flex items-center select-none ${cls}">${escapeHtml(item.label)}${delBtn}</button>`;
      }

      function buildAddLabelBtnHtml(groupKey, title) {
        return `<button type="button" data-open-add-label="${escapeHtml(groupKey)}" data-open-add-title="${escapeHtml(title)}"
          class="px-3 py-1.5 rounded-xl text-xs font-semibold border border-dashed border-zinc-300 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 hover:border-zinc-400 dark:hover:border-zinc-500 active:scale-95 transition inline-flex items-center gap-1 select-none">
          <span>＋ 追加</span>
        </button>`;
      }

      // 多数のチップをコンパクトに折りたたみ表示する共通ヘルパー
      function buildExpandableChipsHtml(items, isSelectedFn, dataAttr, groupKey, addTitle, cfg, limit = 12) {
        const isExpanded = Boolean(state.expandedGroups[groupKey]);
        let visibleItems = items;
        let hiddenCount = 0;

        if (!isExpanded && items.length > limit) {
          const baseSlice = items.slice(0, limit);
          const extraSelected = items.slice(limit).filter(item => isSelectedFn(item) || item.isCustom);
          visibleItems = [...baseSlice, ...extraSelected];
          hiddenCount = items.length - visibleItems.length;
        }

        let html = visibleItems.map(item => buildLabelChipHtml(item, isSelectedFn(item), dataAttr, groupKey, cfg)).join('');
        if (items.length > limit) {
          if (!isExpanded && hiddenCount > 0) {
            html += `<button type="button" data-toggle-expand="${escapeHtml(groupKey)}" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-zinc-200/70 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 active:scale-95 transition select-none">もっと見る (+${hiddenCount})</button>`;
          } else if (isExpanded) {
            html += `<button type="button" data-toggle-expand="${escapeHtml(groupKey)}" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-zinc-200/70 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 active:scale-95 transition select-none">折りたたむ</button>`;
          }
        }
        if (addTitle) html += buildAddLabelBtnHtml(groupKey, addTitle);
        return html;
      }

      // 人物設定セクション描画
      function renderCharactersSection() {
        const count = state.characters.length;

        dom.charCountBadge.textContent = `${count}人`;
        dom.btnAddCharacter.disabled = count >= 3;
        dom.btnAddCharacter.classList.toggle('opacity-40', count >= 3);

        if (count === 0) {
          dom.charSectionBody.classList.add('hidden');
          return;

        if (state.activeCharacterIndex >= count) {
          state.activeCharacterIndex = count - 1;
        }

        // 人物タブ
        dom.charTabsContainer.innerHTML = state.characters.map((c, idx) => {
          const active = idx === state.activeCharacterIndex;

            ? cfg.activeTab
            : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 border-transparent';

        if (count >= 2) {

          const intHtml = getFieldItems('interaction').map(i =>
            buildLabelChipHtml(i, state.groupRelation.interaction === i.id, 'data-group-int', 'interaction', cfg)
          ).join('') + buildAddLabelBtnHtml('interaction', '複数人の関係・動き');

          dom.groupRelationBox.innerHTML = `

              <span class="block text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">並び方・配置</span>
              <div class="flex flex-wrap gap-1.5">${arrHtml}</div>

            <div class="space-y-1.5">
              <span class="block text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">関係・やり取り</span>
              <div class="flex flex-wrap gap-1.5">${intHtml}</div>
            </div>
            <input type="text" data-group-custom value="${escapeHtml(state.groupRelation.custom)}" placeholder="カスタム関係性（例：背中を預けて共闘している）"
              class="w-full text-base rounded-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 px-3 py-2 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
          `;
        } else {
          dom.groupRelationBox.classList.add('hidden');
        }

        // アクティブ人物フォーム
        const char = state.characters[state.activeCharacterIndex];
        const chipIdle = 'bg-zinc-50 dark:bg-zinc-950/60 text-zinc-700 dark:text-zinc-300 border-zinc-200 dark:border-zinc-800 hover:border-zinc-300 dark:hover:border-zinc-700';

        const genderExpanded = Boolean(state.expandedGroups['genders']);
        const genderList = genderExpanded ? CHARACTER_PRESETS.genders : CHARACTER_PRESETS.genders.slice(0, 6);
        const genderHtml = genderList.map(g => {
          const active = char.gender === g.id;
          return `<button type="button" data-char-gender="${g.id}" class="py-2 px-2 rounded-xl text-xs font-bold border transition-all active:scale-95 ${active ? cfg.activeChip : chipIdle}">${escapeHtml(g.label)}</button>`;

        const genderToggleBtn = `<button type="button" data-toggle-expand="genders" class="text-[11px] font-semibold text-blue-600 dark:text-blue-400 active:opacity-70">${genderExpanded ? '定番のみ表示' : `詳細性別を表示 (+${CHARACTER_PRESETS.genders.length - 6})`}</button>`;

        const nationalityHtml = buildExpandableChipsHtml(getFieldItems('nationality'), n => char.nationality === n.id, 'data-char-nationality', 'nationality', '人種・国籍', cfg, 10);
        const raceHtml = buildExpandableChipsHtml(getFieldItems('race'), r => char.race === r.id, 'data-char-race', 'race', '種族', cfg, 10);
        const hairLengthHtml = buildExpandableChipsHtml(getFieldItems('hairLength'), h => char.hairLength === h.id, 'data-char-hair-length', 'hairLength', '頭髪の長さ・髪型', cfg, 12);
        const hairColorHtml = buildExpandableChipsHtml(getFieldItems('hairColor'), h => char.hairColor === h.id, 'data-char-hair-color', 'hairColor', '髪の色', cfg, 12);
        const eyeColorHtml = buildExpandableChipsHtml(getFieldItems('eyeColor'), e => char.eyeColor === e.id, 'data-char-eye-color', 'eyeColor', '瞳（眼球）の色', cfg, 10);
        const styleHtml = buildExpandableChipsHtml(getFieldItems('styles'), s => (char.styles || []).includes(s.id), 'data-char-style', 'styles', 'スタイル・性格・特徴', cfg, 12);
        const expressionHtml = buildExpandableChipsHtml(getFieldItems('expressions'), ex => (char.expressions || []).includes(ex.id), 'data-char-expression', 'expressions', '表情・視線', cfg, 12);
        const outfitHtml = buildExpandableChipsHtml(getFieldItems('outfit'), o => char.outfit === o.id, 'data-char-outfit', 'outfit', '服装', cfg, 12);
        const poseHtml = buildExpandableChipsHtml(getFieldItems('pose'), p => char.pose === p.id, 'data-char-pose', 'pose', '姿勢・ポーズ', cfg, 12);
        const propHtml = buildExpandableChipsHtml(getFieldItems('props'), pr => (char.props || []).includes(pr.id), 'data-char-prop', 'props', '持たせる小物・装備', cfg, 12);

        const positionBlock = count >= 2 ? `
          <div class="pt-3 border-t border-zinc-100 dark:border-zinc-800/80 space-y-2">
            <span class="block text-xs font-bold text-zinc-600 dark:text-zinc-300">画面内の立ち位置</span>
            <div class="flex flex-wrap gap-1.5">
              ${CHARACTER_PRESETS.positions.map(pos => {
                const active = (char.position || '') === pos.id;
                return `<button type="button" data-char-position="${pos.id}" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all active:scale-95 ${active ? cfg.activeChip : chipIdle}">${escapeHtml(pos.label)}</button>`;
              }).join('')}

          </div>
        ` : '';

        dom.charActiveForm.innerHTML = `
          <!-- メイン：性別 -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-zinc-700 dark:text-zinc-200">性別 <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-500">メイン</span></span>
              ${genderToggleBtn}
            </div>
            <div class="grid grid-cols-3 gap-1.5">${genderHtml}</div>
          </div>

          <!-- 人種・国籍 -->
          <div class="pt-3 border-t border-zinc-100 dark:border-zinc-800/80 space-y-2">
            <span class="block text-xs font-bold text-zinc-600 dark:text-zinc-300">人種・国籍</span>
            <div class="flex flex-wrap gap-1.5">${nationalityHtml}</div>
            <input type="text" data-char-input="nationalityCustom" value="${escapeHtml(char.nationalityCustom || '')}" placeholder="カスタム人種・国籍（例：スペイン人、ブラジル人）"
              class="w-full text-base rounded-xl bg-zinc-50 dark:bg-zinc-950/70 border border-zinc-200 dark:border-zinc-800 px-3 py-2 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
          </div>

          <!-- 種族 -->
          <div class="pt-3 border-t border-zinc-100 dark:border-zinc-800/80 space-y-2">
            <span class="block text-xs font-bold text-zinc-600 dark:text-zinc-300">種族</span>

      // シーン設定セクション描画
      function renderSceneSection() {
        const sc = state.scene;
        const cfg = getActiveAICfg();
        const hasScene = Boolean(sc.background || sc.backgroundCustom.trim() || sc.time || sc.timeCustom.trim() || sc.weathers.length || sc.weatherCustom.trim());
        dom.sceneSummaryBadge.classList.toggle('hidden', !hasScene);

        dom.sceneBody.classList.toggle('open', sc.open);
        dom.btnToggleScene.setAttribute('aria-expanded', sc.open ? 'true' : 'false');
        dom.sceneChevron.classList.toggle('rotate-180', sc.open);

        const bgHtml = buildExpandableChipsHtml(getFieldItems('background'), b => sc.background === b.id, 'data-scene-bg', 'background', '背景・場所', cfg, 12);
        const timeHtml = getFieldItems('time').map(t =>
          buildLabelChipHtml(t, (sc.time || '') === t.id, 'data-scene-time', 'time', cfg)
        ).join('') + buildAddLabelBtnHtml('time', '時間帯・日時');
        const weatherHtml = getFieldItems('weathers').map(w =>
          buildLabelChipHtml(w, (sc.weathers || []).includes(w.id), 'data-scene-weather', 'weathers', cfg)
        ).join('') + buildAddLabelBtnHtml('weathers', '季節・天候');

        dom.sceneFormContainer.innerHTML = `
          <div class="space-y-2">
            <span class="block text-xs font-bold text-zinc-600 dark:text-zinc-300">背景・場所</span>
            <div class="flex flex-wrap gap-1.5">${bgHtml}</div>
            <input type="text" data-scene-input="backgroundCustom" value="${escapeHtml(sc.backgroundCustom)}" placeholder="カスタム背景（例：夕焼けの駅前ロータリー）"
              class="w-full text-base rounded-xl bg-zinc-50 dark:bg-zinc-950/70 border border-zinc-200 dark:border-zinc-800 px-3 py-2 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
          </div>

          <div class="pt-3 border-t border-zinc-100 dark:border-zinc-800/80 space-y-2">
            <span class="block text-xs font-bold text-zinc-600 dark:text-zinc-300">時間帯・日時</span>
            <div class="flex flex-wrap gap-1.5">${timeHtml}</div>
            <input type="text" data-scene-input="timeCustom" value="${escapeHtml(sc.timeCustom)}" placeholder="カスタム時間帯（例：夜明け直前、クリスマス夜）"
              class="w-full text-base rounded-xl bg-zinc-50 dark:bg-zinc-950/70 border border-zinc-200 dark:border-zinc-800 px-3 py-2 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
          </div>

          <div class="pt-3 border-t border-zinc-100 dark:border-zinc-800/80 space-y-2">
            <span class="block text-xs font-bold text-zinc-600 dark:text-zinc-300">季節・天候 <span class="text-[10px] font-normal text-zinc-400">複数選択可</span></span>
            <div class="flex flex-wrap gap-1.5">${weatherHtml}</div>
            <input type="text" data-scene-input="weatherCustom" value="${escapeHtml(sc.weatherCustom)}" placeholder="カスタム天候（例：虹が出ている、強風）"
              class="w-full text-base rounded-xl bg-zinc-50 dark:bg-zinc-950/70 border border-zinc-200 dark:border-zinc-800 px-3 py-2 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
          </div>
        `;

      // カテゴリータブ＆パネル描画
      function renderCategoryTabs() {
        const cfg = getActiveAICfg();
        dom.categoryTabs.innerHTML = CATEGORIES.map(cat => {
          const isCurrent = cat.id === state.activeCategory;
          const cnt = (state.selectedTags[cat.id] || []).length;
          const badge = cnt > 0 ? `<span class="ml-1 px-1.5 py-0.2 rounded-full text-[10px] ${isCurrent ? 'bg-white/25' : 'bg-blue-500/15 text-blue-600 dark:text-blue-400'}">${cnt}</span>` : '';
          const cls = isCurrent
            ? cfg.activeTab
            : 'bg-zinc-100 dark:bg-zinc-800/80 text-zinc-600 dark:text-zinc-300 border-transparent';
          return `<button type="button" data-cat-tab="${cat.id}" class="px-3 py-1.5 rounded-xl text-xs font-bold border whitespace-nowrap transition-all active:scale-95 inline-flex items-center ${cls}">${escapeHtml(cat.shortName)}${badge}</button>`;
        }).join('');
      }

      function renderActiveCategoryPanel() {
        const cat = CATEGORIES.find(c => c.id === state.activeCategory) || CATEGORIES[0];
        const cfg = getActiveAICfg();
        const selected = state.selectedTags[cat.id] || [];
        const items = getCategoryItems(cat.id);

        const chipsHtml = items.map(item =>
          buildLabelChipHtml(item, selected.includes(item.id), `data-cat-item="${cat.id}" data-item-id`, `cat_${cat.id}`, cfg)
        ).join('') + buildAddLabelBtnHtml(`cat_${cat.id}`, cat.title);

        dom.categoryPanel.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-zinc-500 dark:text-zinc-400">${escapeHtml(cat.title)}（複数選択可）</span>
          </div>
          <div class="flex flex-wrap gap-1.5">${chipsHtml}</div>
        `;
      }

      function renderSelectedSummary() {
        const allChips = [];
        CATEGORIES.forEach(cat => {
          getSelectedItems(cat.id).forEach(item => {
            allChips.push({ catId: cat.id, item });
          });
        });

        dom.selectedCountBadge.textContent = `${allChips.length}個選択中`;
        if (allChips.length === 0) {
          dom.selectedSummaryWrap.classList.add('hidden');
          dom.selectedSummary.innerHTML = '';
          return;
        }
        dom.selectedSummaryWrap.classList.remove('hidden');
        dom.selectedSummary.innerHTML = allChips.map(({ catId, item }) => `
          <button type="button" data-remove-tag-cat="${catId}" data-remove-tag-id="${escapeHtml(item.id)}"
            class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20 hover:bg-rose-500/10 hover:text-rose-500 active:scale-95 transition inline-flex items-center gap-1">
            <span>${escapeHtml(item.label)}</span><span class="text-[10px]">✕</span>
          </button>
        `).join('');
      }

      // 除外要素チップ描画
      function renderNegativeChips() {
        const isExpanded = Boolean(state.expandedGroups['negatives']);
        const limit = 12;
        const list = isExpanded ? NEGATIVE_PRESETS : NEGATIVE_PRESETS.slice(0, limit);
        const cur = state.negative.toLowerCase();

        let html = list.map(n => {
          const val = state.lang === 'en' ? n.en : n.label;
          const isAdded = cur.includes(n.en.toLowerCase()) || cur.includes(n.label.toLowerCase());
          const cls = isAdded
            ? 'bg-blue-500/15 text-blue-600 dark:text-blue-400 border-blue-500/30'
            : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 border-transparent';
          return `<button type="button" data-neg-val="${escapeHtml(val)}" class="text-[11px] font-medium px-2.5 py-1 rounded-lg border active:scale-95 transition ${cls}">+ ${escapeHtml(n.label)}</button>`;
        }).join('');

        if (NEGATIVE_PRESETS.length > limit) {
          html += `<button type="button" data-toggle-expand="negatives" class="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-zinc-200/80 dark:bg-zinc-700 text-zinc-700 dark:text-zinc-200 active:scale-95 transition">${isExpanded ? '折りたたむ' : `もっと見る (+${NEGATIVE_PRESETS.length - limit})`}</button>`;
        }
        dom.negChipsContainer.innerHTML = html;
      }

      function updateLangUI() {
        dom.langBtns.forEach(btn => {
          const isCurrent = btn.dataset.lang === state.lang;
          btn.className = 'lang-btn px-2.5 py-1 rounded-md text-[11px] font-bold transition-all active:scale-95 ' +
            (isCurrent
              ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm'
              : 'text-zinc-500 dark:text-zinc-400');
        });
        renderNegativeChips();
        updatePreview();
      }

      function updateHistoryBadge() {
        const len = state.history.length;
        dom.historyBadge.textContent = String(len);
        dom.historyBadge.classList.toggle('hidden', len === 0);
      }

      function updatePreview() {
        const prompt = generatePrompt();
        if (!prompt) {
          dom.promptPreview.textContent = '項目を選択するか主題を入力すると、ここに最適化されたプロンプトが表示されます。';
          dom.promptPreview.classList.add('text-zinc-400', 'dark:text-zinc-500');
          dom.previewCharCount.textContent = '0文字';
          dom.safetyBanner.classList.add('hidden');
          return;
        }
        dom.promptPreview.textContent = prompt;
        dom.promptPreview.classList.remove('text-zinc-400', 'dark:text-zinc-500');
        dom.previewCharCount.textContent = `${prompt.length}文字`;
        runSafetyCheck(prompt);
      }

      function renderAll() {
        renderAITabs();
        updateLangUI();
        renderRatios();
        renderCharactersSection();
        renderSceneSection();
        renderCategoryTabs();
        renderActiveCategoryPanel();
        renderSelectedSummary();
        renderNegativeChips();
        updateHistoryBadge();
        updatePreview();
      }

      // ============================================================
      // 6. カスタムラベル追加・削除 / 履歴モーダル
      // ============================================================
      function openCustomLabelModal(groupKey, title) {
        state.activeLabelModal = { groupKey, title };
        dom.modalAddTitle.textContent = `「${title}」にカスタムラベルを追加`;
        dom.customLabelJa.value = '';
        dom.customLabelEn.value = '';
        dom.modalAddLabel.classList.remove('hidden');
        setTimeout(() => dom.customLabelJa.focus(), 50);
      }

      function closeCustomLabelModal() {
        state.activeLabelModal = null;
        dom.modalAddLabel.classList.add('hidden');
      }

      function deleteCustomLabel(groupKey, id) {
        const list = state.customLabels[groupKey] || [];
        state.customLabels[groupKey] = list.filter(item => item.id !== id);
        saveCustomLabels();

        if (groupKey.startsWith('cat_')) {
          const catId = groupKey.replace('cat_', '');
          state.selectedTags[catId] = (state.selectedTags[catId] || []).filter(x => x !== id);
          renderCategoryTabs();
          renderActiveCategoryPanel();
          renderSelectedSummary();
        } else if (['nationality', 'race', 'hairLength', 'hairColor', 'eyeColor', 'outfit', 'pose'].includes(groupKey)) {
          state.characters.forEach(c => { if (c[groupKey] === id) c[groupKey] = ''; });
          renderCharactersSection();
        } else if (['styles', 'expressions', 'props'].includes(groupKey)) {
          state.characters.forEach(c => { c[groupKey] = (c[groupKey] || []).filter(x => x !== id); });
          renderCharactersSection();
        } else if (['arrangement', 'interaction'].includes(groupKey)) {
          if (state.groupRelation[groupKey] === id) state.groupRelation[groupKey] = '';
          renderCharactersSection();
        } else if (['background', 'time'].includes(groupKey)) {
          if (state.scene[groupKey] === id) state.scene[groupKey] = '';
          renderSceneSection();
        } else if (groupKey === 'weathers') {
          state.scene.weathers = state.scene.weathers.filter(x => x !== id);
          renderSceneSection();
        }
        updatePreview();
        showToast('カスタムラベルを削除しました');
      }

      function addHistoryEntry(promptText, isFavorite = false) {
        if (!promptText) return;
        const existingIdx = state.history.findIndex(h => h.prompt === promptText && h.ai === state.ai);
        const snapshot = JSON.parse(JSON.stringify({
          ai: state.ai,
          lang: state.lang,
          subject: state.subject,
          textInImage: state.textInImage,
          ratio: state.ratio,
          negative: state.negative,
          selectedTags: state.selectedTags,
          characters: state.characters,
          groupRelation: state.groupRelation,
          scene: state.scene
        }));

        if (existingIdx >= 0) {
          const prev = state.history[existingIdx];
          state.history.splice(existingIdx, 1);
          state.history.unshift({
            ...prev,
            favorite: prev.favorite || isFavorite,
            updatedAt: new Date().toLocaleString('ja-JP'),
            snapshot
          });
        } else {
          state.history.unshift({
            id: 'hist_' + Date.now(),
            ai: state.ai,
            prompt: promptText,
            favorite: isFavorite,
            updatedAt: new Date().toLocaleString('ja-JP'),
            snapshot
          });
        }
        saveHistoryStorage();
        updateHistoryBadge();
      }

      function renderHistoryModal() {
        const list = state.historyFavOnly ? state.history.filter(h => h.favorite) : state.history;
        dom.btnFilterFav.className = 'text-[11px] font-bold px-2.5 py-1 rounded-lg active:scale-95 transition ' +
          (state.historyFavOnly
            ? 'bg-amber-500 text-white'
            : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300');

        if (list.length === 0) {
          dom.historyList.innerHTML = `<p class="text-center text-xs text-zinc-400 py-10">${state.historyFavOnly ? 'お気に入りはまだありません' : '履歴はまだありません（コピーまたは保存すると記録されます）'}</p>`;
          return;
        }

        dom.historyList.innerHTML = list.map(item => `
          <div class="rounded-xl bg-zinc-50 dark:bg-zinc-950/70 border border-zinc-200/80 dark:border-zinc-800 p-3 space-y-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5">

            <div class="flex items-center gap-2 pt-1">
              <button type="button" data-hist-restore="${item.id}" class="px-3 py-1 rounded-lg text-[11px] font-bold bg-zinc-200/80 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-200 active:scale-95 transition">設定を復元</button>
              <button type="button" data-hist-copy="${item.id}" class="px-3 py-1 rounded-lg text-[11px] font-bold bg-blue-600 text-white active:scale-95 transition">コピー</button>
            </div>
          </div>
        `).join('');
