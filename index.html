      // ============================================================
      // 7. イベントリスナー設定
      // ============================================================
      dom.aiTabs.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-ai]');
        if (!btn) return;
        state.ai = btn.dataset.ai;
        renderAll();
      });

      dom.langBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          state.lang = btn.dataset.lang;
          updateLangUI();
        });
      });

      dom.subjectInput.addEventListener('input', (e) => {
        state.subject = e.target.value;
        updatePreview();
      });

      dom.textInImageInput.addEventListener('input', (e) => {
        state.textInImage = e.target.value;
        updatePreview();
      });

      dom.ratioContainer.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-ratio]');
        if (!btn) return;
        state.ratio = btn.dataset.ratio;
        renderRatios();
        updatePreview();
      });

      // 人物追加
      dom.btnAddCharacter.addEventListener('click', () => {
        if (state.characters.length >= 3) return;
        state.characters.push(createDefaultCharacter());
        state.activeCharacterIndex = state.characters.length - 1;
        renderCharactersSection();
        updatePreview();
      });

      // 人物タブ切替・削除
      dom.charTabsContainer.addEventListener('click', (e) => {
        const remBtn = e.target.closest('[data-char-remove]');
        if (remBtn) {
          const idx = Number(remBtn.dataset.charRemove);
          state.characters.splice(idx, 1);
          if (state.activeCharacterIndex >= state.characters.length) {
            state.activeCharacterIndex = Math.max(0, state.characters.length - 1);
          }
          renderCharactersSection();
          updatePreview();
          return;
        }
        const tabBtn = e.target.closest('[data-char-tab]');
        if (tabBtn) {
          state.activeCharacterIndex = Number(tabBtn.dataset.charTab);
          renderCharactersSection();
        }
      });

      // 複数人配置・関係性
      dom.groupRelationBox.addEventListener('click', (e) => {
        const delBtn = e.target.closest('[data-delete-custom-id]');
        if (delBtn) {
          e.stopPropagation();
          deleteCustomLabel(delBtn.dataset.deleteCustomGroup, delBtn.dataset.deleteCustomId);
          return;
        }
        const addBtn = e.target.closest('[data-open-add-label]');
        if (addBtn) {
          openCustomLabelModal(addBtn.dataset.openAddLabel, addBtn.dataset.openAddTitle);
          return;
        }
        const arrBtn = e.target.closest('[data-group-arr]');
        if (arrBtn) {
          const val = arrBtn.dataset.groupArr;
          state.groupRelation.arrangement = state.groupRelation.arrangement === val ? '' : val;
          renderCharactersSection();
          updatePreview();
          return;
        }
        const intBtn = e.target.closest('[data-group-int]');
        if (intBtn) {
          const val = intBtn.dataset.groupInt;
          state.groupRelation.interaction = state.groupRelation.interaction === val ? '' : val;
          renderCharactersSection();
          updatePreview();
        }
      });

      dom.groupRelationBox.addEventListener('input', (e) => {
        if (e.target.matches('[data-group-custom]')) {
          state.groupRelation.custom = e.target.value;
          updatePreview();
        }
      });

      // 人物フォーム内のクリック
      dom.charActiveForm.addEventListener('click', (e) => {
        const delBtn = e.target.closest('[data-delete-custom-id]');
        if (delBtn) {
          e.stopPropagation();
          deleteCustomLabel(delBtn.dataset.deleteCustomGroup, delBtn.dataset.deleteCustomId);
          return;
        }
        const expandBtn = e.target.closest('[data-toggle-expand]');
        if (expandBtn) {
          const key = expandBtn.dataset.toggleExpand;
          state.expandedGroups[key] = !state.expandedGroups[key];
          renderCharactersSection();
          return;
        }
        const openAddBtn = e.target.closest('[data-open-add-label]');
        if (openAddBtn) {
          openCustomLabelModal(openAddBtn.dataset.openAddLabel, openAddBtn.dataset.openAddTitle);
          return;
        }

        const char = state.characters[state.activeCharacterIndex];
        if (!char) return;

        const singleMap = [
          ['data-char-gender', 'gender', false],
          ['data-char-nationality', 'nationality', true],
          ['data-char-race', 'race', true],
          ['data-char-hair-length', 'hairLength', true],
          ['data-char-hair-color', 'hairColor', true],
          ['data-char-eye-color', 'eyeColor', true],
          ['data-char-outfit', 'outfit', true],
          ['data-char-pose', 'pose', true],
          ['data-char-position', 'position', false]
        ];

        for (const [attr, field, toggleOff] of singleMap) {
          const btn = e.target.closest(`[${attr}]`);
          if (btn) {
            const val = btn.getAttribute(attr);
            char[field] = (toggleOff && char[field] === val) ? '' : val;
            renderCharactersSection();
            updatePreview();
            return;
          }
        }

        const multiMap = [
          ['data-char-style', 'styles'],
          ['data-char-expression', 'expressions'],
          ['data-char-prop', 'props']
        ];

        for (const [attr, field] of multiMap) {
          const btn = e.target.closest(`[${attr}]`);
          if (btn) {
            const val = btn.getAttribute(attr);
            char[field] = char[field] || [];
            char[field] = char[field].includes(val)
              ? char[field].filter(x => x !== val)
              : [...char[field], val];
            renderCharactersSection();
            updatePreview();
            return;
          }
        }
      });

      dom.charActiveForm.addEventListener('input', (e) => {
        const input = e.target.closest('[data-char-input]');
        if (!input) return;
        const char = state.characters[state.activeCharacterIndex];
        if (!char) return;
        char[input.dataset.charInput] = input.value;
        updatePreview();
      });

      // シーン開閉＆クリック
      dom.btnToggleScene.addEventListener('click', () => {
        state.scene.open = !state.scene.open;
        renderSceneSection();
      });

      dom.sceneFormContainer.addEventListener('click', (e) => {
        const delBtn = e.target.closest('[data-delete-custom-id]');
        if (delBtn) {
          e.stopPropagation();
          deleteCustomLabel(delBtn.dataset.deleteCustomGroup, delBtn.dataset.deleteCustomId);
          return;
        }
        const expandBtn = e.target.closest('[data-toggle-expand]');
        if (expandBtn) {
          const key = expandBtn.dataset.toggleExpand;
          state.expandedGroups[key] = !state.expandedGroups[key];
          renderSceneSection();
          return;
        }
        const openAddBtn = e.target.closest('[data-open-add-label]');
        if (openAddBtn) {
          openCustomLabelModal(openAddBtn.dataset.openAddLabel, openAddBtn.dataset.openAddTitle);
          return;
        }

        const bgBtn = e.target.closest('[data-scene-bg]');
        if (bgBtn) {
          const val = bgBtn.dataset.sceneBg;
          state.scene.background = state.scene.background === val ? '' : val;
          renderSceneSection();
          updatePreview();
          return;
        }
        const timeBtn = e.target.closest('[data-scene-time]');
        if (timeBtn) {
          const val = timeBtn.dataset.sceneTime;
          state.scene.time = state.scene.time === val ? '' : val;
          renderSceneSection();
          updatePreview();
          return;
        }
        const wBtn = e.target.closest('[data-scene-weather]');
        if (wBtn) {
          const val = wBtn.dataset.sceneWeather;
          state.scene.weathers = state.scene.weathers.includes(val)
            ? state.scene.weathers.filter(x => x !== val)
            : [...state.scene.weathers, val];
          renderSceneSection();
          updatePreview();
        }
      });

      dom.sceneFormContainer.addEventListener('input', (e) => {
        const input = e.target.closest('[data-scene-input]');
        if (!input) return;
        state.scene[input.dataset.sceneInput] = input.value;
        renderSceneSection();
        updatePreview();
      });

      // 7カテゴリータブ＆チップ
      dom.categoryTabs.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-cat-tab]');
        if (!btn) return;
        state.activeCategory = btn.dataset.catTab;
        renderCategoryTabs();
        renderActiveCategoryPanel();
      });

      dom.categoryPanel.addEventListener('click', (e) => {
        const delBtn = e.target.closest('[data-delete-custom-id]');
        if (delBtn) {
          e.stopPropagation();
          deleteCustomLabel(delBtn.dataset.deleteCustomGroup, delBtn.dataset.deleteCustomId);
          return;
        }
        const addBtn = e.target.closest('[data-open-add-label]');
        if (addBtn) {
          openCustomLabelModal(addBtn.dataset.openAddLabel, addBtn.dataset.openAddTitle);
          return;
        }
        const itemBtn = e.target.closest('[data-cat-item]');
        if (!itemBtn) return;
        const catId = itemBtn.dataset.catItem;
        const itemId = itemBtn.dataset.itemId;
        state.selectedTags[catId] = state.selectedTags[catId] || [];
        state.selectedTags[catId] = state.selectedTags[catId].includes(itemId)
          ? state.selectedTags[catId].filter(x => x !== itemId)
          : [...state.selectedTags[catId], itemId];
        renderCategoryTabs();
        renderActiveCategoryPanel();
        renderSelectedSummary();
        updatePreview();
      });

      dom.selectedSummary.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-remove-tag-cat]');
        if (!btn) return;
        const catId = btn.dataset.removeTagCat;
        const itemId = btn.dataset.removeTagId;
        state.selectedTags[catId] = (state.selectedTags[catId] || []).filter(x => x !== itemId);
        renderCategoryTabs();
        renderActiveCategoryPanel();
        renderSelectedSummary();
        updatePreview();
      });

      dom.btnClearTags.addEventListener('click', () => {
        state.selectedTags = {};
        renderCategoryTabs();
        renderActiveCategoryPanel();
        renderSelectedSummary();
        updatePreview();
      });

      // 詳細オプション（ネガティブ指示）
      dom.btnToggleOptions.addEventListener('click', () => {
        state.optionsOpen = !state.optionsOpen;
        dom.accordionOptionsBody.classList.toggle('open', state.optionsOpen);
        dom.btnToggleOptions.setAttribute('aria-expanded', state.optionsOpen ? 'true' : 'false');
        dom.accordionChevron.classList.toggle('rotate-180', state.optionsOpen);
      });

      dom.negativeInput.addEventListener('input', (e) => {
        state.negative = e.target.value;
        renderNegativeChips();
        updatePreview();
      });

      dom.btnNegQualityPack.addEventListener('click', () => {
        const pack = state.lang === 'en' ? NEGATIVE_QUALITY_PACK_EN : NEGATIVE_QUALITY_PACK_JA;
        const sep = state.lang === 'en' ? ', ' : '、';
        const cur = state.negative.trim();
        state.negative = cur ? `${cur}${sep}${pack}` : pack;
        dom.negativeInput.value = state.negative;
        renderNegativeChips();
        updatePreview();
        showToast('定番の品質崩れ防止タグを追加しました！', '✨');
      });

      dom.btnClearNegative.addEventListener('click', () => {
        state.negative = '';
        dom.negativeInput.value = '';
        renderNegativeChips();
        updatePreview();
      });

      dom.negChipsContainer.addEventListener('click', (e) => {
        const expandBtn = e.target.closest('[data-toggle-expand]');
        if (expandBtn) {
          const key = expandBtn.dataset.toggleExpand;
          state.expandedGroups[key] = !state.expandedGroups[key];
          renderNegativeChips();
          return;
        }
        const btn = e.target.closest('[data-neg-val]');
        if (!btn) return;
        const val = btn.dataset.negVal;
        const sep = state.lang === 'en' ? ', ' : '、';
        const cur = state.negative.trim();
        if (!cur.toLowerCase().includes(val.toLowerCase())) {
          state.negative = cur ? `${cur}${sep}${val}` : val;
          dom.negativeInput.value = state.negative;
          renderNegativeChips();
          updatePreview();
        }
      });

      // プレビュー開閉・コピー・お気に入り保存
      dom.btnTogglePreview.addEventListener('click', () => {
        state.previewExpanded = !state.previewExpanded;
        dom.previewBoxWrap.classList.toggle('hidden', !state.previewExpanded);
        dom.previewChevron.classList.toggle('rotate-180', !state.previewExpanded);
      });

      dom.btnCopyPrompt.addEventListener('click', () => {
        const prompt = generatePrompt();
        if (!prompt) {
          showToast('先に項目を選択するか主題を入力してください', 'ℹ️');
          return;
        }
        const ok = copyTextToClipboard(prompt);
        if (ok) {
          addHistoryEntry(prompt, false);
          showToast('プロンプトをコピーしました！', '📋');
        } else {
          showToast('コピーに失敗しました。枠内を手動で選択してください', '⚠️');
        }
      });

      dom.btnSaveFavorite.addEventListener('click', () => {
        const prompt = generatePrompt();
        if (!prompt) {
          showToast('保存するプロンプトが空です', 'ℹ️');
          return;
        }
        addHistoryEntry(prompt, true);
        showToast('お気に入りに保存しました！', '★');
      });

      // 全リセット
      dom.btnResetAll.addEventListener('click', () => {
        state.subject = '';
        state.textInImage = '';
        state.ratio = '';
        state.negative = '';
        state.selectedTags = {};
        state.characters = [];
        state.activeCharacterIndex = 0;
        state.groupRelation = { arrangement: '', interaction: '', custom: '' };
        state.scene = {
          open: state.scene.open,
          background: '',
          backgroundCustom: '',
          time: '',
          timeCustom: '',
          weathers: [],
          weatherCustom: ''
        };
        dom.subjectInput.value = '';
        dom.textInImageInput.value = '';
        dom.negativeInput.value = '';
        renderAll();
        showToast('選択内容をすべてリセットしました', '↺');
      });

      // ダーク/ライト切替
      dom.btnThemeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        dom.metaThemeColor.setAttribute('content', isDark ? '#09090b' : '#fafafa');
        try {
          localStorage.setItem(STORAGE_KEYS.theme, isDark ? 'dark' : 'light');
        } catch (e) {}
      });

      // カスタムラベル追加モーダル
      dom.btnCloseLabelModal.addEventListener('click', closeCustomLabelModal);
      dom.btnCancelLabelModal.addEventListener('click', closeCustomLabelModal);
      dom.modalAddLabel.addEventListener('click', (e) => {
        if (e.target === dom.modalAddLabel) closeCustomLabelModal();
      });

      dom.btnSubmitLabelModal.addEventListener('click', () => {
        if (!state.activeLabelModal) return;
        const ja = dom.customLabelJa.value.trim();
        const en = dom.customLabelEn.value.trim() || ja;
        if (!ja) {
          showToast('表示名を入力してください', '⚠️');
          return;
        }
        const { groupKey } = state.activeLabelModal;
        const newItem = {
          id: 'custom_' + Date.now(),
          label: ja,
          en,
          isCustom: true
        };
        state.customLabels[groupKey] = [...(state.customLabels[groupKey] || []), newItem];
        saveCustomLabels();

        // 追加と同時に自動選択
        if (groupKey.startsWith('cat_')) {
          const catId = groupKey.replace('cat_', '');
          state.selectedTags[catId] = [...(state.selectedTags[catId] || []), newItem.id];
          renderCategoryTabs();
          renderActiveCategoryPanel();
          renderSelectedSummary();
        } else {
          const activeChar = state.characters[state.activeCharacterIndex];
          if (['nationality', 'race', 'hairLength', 'hairColor', 'eyeColor', 'outfit', 'pose'].includes(groupKey) && activeChar) {
            activeChar[groupKey] = newItem.id;
            renderCharactersSection();
          } else if (['styles', 'expressions', 'props'].includes(groupKey) && activeChar) {
            activeChar[groupKey] = [...(activeChar[groupKey] || []), newItem.id];
            renderCharactersSection();
          } else if (['arrangement', 'interaction'].includes(groupKey)) {
            state.groupRelation[groupKey] = newItem.id;
            renderCharactersSection();
          } else if (['background', 'time'].includes(groupKey)) {
            state.scene[groupKey] = newItem.id;
            renderSceneSection();
          } else if (groupKey === 'weathers') {
            state.scene.weathers = [...state.scene.weathers, newItem.id];
            renderSceneSection();
          }
        }
        updatePreview();
        closeCustomLabelModal();
        showToast(`「${ja}」を追加しました！`, '✨');
      });

      // 履歴モーダル
      dom.btnOpenHistory.addEventListener('click', () => {
        renderHistoryModal();
        dom.modalHistory.classList.remove('hidden');
      });

      dom.btnCloseHistoryModal.addEventListener('click', () => {
        dom.modalHistory.classList.add('hidden');
      });

      dom.modalHistory.addEventListener('click', (e) => {
        if (e.target === dom.modalHistory) dom.modalHistory.classList.add('hidden');
      });

      dom.btnFilterFav.addEventListener('click', () => {
        state.historyFavOnly = !state.historyFavOnly;
        renderHistoryModal();
      });

      dom.historyList.addEventListener('click', (e) => {
        const favBtn = e.target.closest('[data-hist-fav]');
        if (favBtn) {
          const item = state.history.find(h => h.id === favBtn.dataset.histFav);
          if (item) {
            item.favorite = !item.favorite;
            saveHistoryStorage();
            renderHistoryModal();
          }
          return;
        }
        const delBtn = e.target.closest('[data-hist-del]');
        if (delBtn) {
          state.history = state.history.filter(h => h.id !== delBtn.dataset.histDel);
          saveHistoryStorage();
          updateHistoryBadge();
          renderHistoryModal();
          return;
        }
        const copyBtn = e.target.closest('[data-hist-copy]');
        if (copyBtn) {
          const item = state.history.find(h => h.id === copyBtn.dataset.histCopy);
          if (item && copyTextToClipboard(item.prompt)) {
            showToast('履歴からコピーしました！', '📋');
          }
          return;
        }
        const resBtn = e.target.closest('[data-hist-restore]');
        if (resBtn) {
          const item = state.history.find(h => h.id === resBtn.dataset.histRestore);
          if (item && item.snapshot) {
            const s = JSON.parse(JSON.stringify(item.snapshot));
            state.ai = s.ai || 'chatgpt';
            state.lang = s.lang || 'en';
            state.subject = s.subject || '';
            state.textInImage = s.textInImage || '';
            state.ratio = s.ratio || '';
            state.negative = s.negative || '';
            state.selectedTags = s.selectedTags || {};
            state.characters = s.characters || [];
            state.activeCharacterIndex = 0;
            state.groupRelation = s.groupRelation || { arrangement: '', interaction: '', custom: '' };
            state.scene = s.scene || state.scene;
            dom.subjectInput.value = state.subject;
            dom.textInImageInput.value = state.textInImage;
            dom.negativeInput.value = state.negative;
            renderAll();
            dom.modalHistory.classList.add('hidden');
            showToast('履歴の設定を復元しました！', '↺');
          }
        }
      });

      // ============================================================
      // 8. 初期化実行
      // ============================================================
      loadStorage();
      renderAll();
    })();
  </script>
</body>
</html>
